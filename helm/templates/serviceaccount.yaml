{{- if .Values.serviceAccount.create }}
---
# A dedicated identity rather than the namespace `default` service account.
#
# This service calls no Kubernetes API, so the account exists to not carry the default one's
# token: `automountServiceAccountToken: false` keeps an API credential out of a pod whose whole
# purpose is holding somebody else's API key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "onramp.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "onramp.fullname" . }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
